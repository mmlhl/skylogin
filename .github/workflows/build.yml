name: 构建

# 只在两种情况下构建：
#   1. 手动触发（Actions 页面点「Run workflow」，或者用 gh 命令）
#   2. 推版本标签（v1.2.0 这种）
#
# 普通 push 不会触发——避免每次改代码都跑一遍构建。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.2.0）。留空则自动生成 build-<构建序号>'
        required: false
        type: string
      release:
        description: '构建完成后创建 GitHub Release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  UPDATE_API: https://api-skylogin.mmlhl.party
  # secrets 只能在这里（workflow 级 env）映射进 env 上下文，步骤的 if 才能读到
  APP_KEY: ${{ secrets.APP_KEY }}

jobs:
  build:
    name: 构建 Windows 版
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 不开 cache：Actions 存储免费额度只有 0.5GB，Go+npm 缓存
          # 按 ref 隔离双份存储，几次 tag 构建就爆；慢一分钟换零占用
          cache: false

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          $manual = "${{ inputs.version }}"
          $tag = "${{ github.ref_name }}"

          if ($manual -ne "") {
            $v = $manual.TrimStart('v')
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $v = $tag.TrimStart('v')
          } else {
            $v = "build-${{ github.run_number }}"
          }

          $isRelease = "${{ inputs.release }}" -eq "true" -or "${{ github.ref_type }}" -eq "tag"
          "version=$v" >> $env:GITHUB_OUTPUT
          # GitHub 的 if 是字符串比较，统一输出小写
          "release=$($isRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v / 创建 Release: $isRelease"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 跑测试
        run: go test ./...

      - name: 构建 exe
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $bt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mmZ")
          $ldflags = "-s -w -H=windowsgui -X skylogin/internal/app.Version=${{ steps.ver.outputs.version }} -X skylogin/internal/app.Build=${{ github.run_number }} -X skylogin/internal/app.BuildTime=$bt"
          go build -trimpath -ldflags $ldflags -o skylogin.exe ./cmd/skylogin
          $size = [math]::Round((Get-Item skylogin.exe).Length / 1MB, 1)
          Write-Host "构建完成: skylogin.exe ($size MB)"

      - name: 登记新版本到更新服务
        if: steps.ver.outputs.release == 'true' && env.APP_KEY != ''
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        shell: pwsh
        run: |
          $payload = @{
            version = "${{ steps.ver.outputs.version }}"
            build = ${{ github.run_number }}
            download_url = "https://github.com/mmlhl/skylogin/releases/latest"
            changelog = "构建 ${{ github.run_number }}"
            force = $false
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Uri "${{ vars.UPDATE_API }}/admin/version" -Method Post -ContentType "application/json; charset=utf-8" -Headers @{ "X-App-Key" = $env:APP_KEY } -Body $payload
            Write-Host "已登记版本"
          } catch { Write-Warning ("登记失败: " + $_.Exception.Message) }

      - name: 创建 Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          # 只放 exe；源码压缩包 GitHub 会自动附在 Release 上
          files: skylogin.exe
          draft: false
          prerelease: false
          body: |
            ## 光遇账号登录器 ${{ steps.ver.outputs.version }}

            - 支持：华为渠道 / 网易官方 / B站 / 4399 / vivo（扫码、验证码、密码）
            - 多开：数量不限，窗口自动排列 + 监控墙
            - 单文件 exe，免安装，不注入游戏进程

            ### 文件
            - `skylogin.exe` —— 主程序
            - 更新日志见「设置 → 检查更新」与软件内公告

            ### 支持的账号
            - ✅ **华为渠道**账号（扫码添加）
            - ✅ **网易官方（官服）**账号（扫码 / 手机号 / 网页登录）
            - ✅ **B站 / 4399 / vivo** 渠道账号（网页登录）
            - ❌ 小米、TapTap 等其它渠道暂不支持

            ### 怎么用
            1. 下载 `skylogin.exe`，双击运行（会请求管理员权限，光遇本体需要）
            2. 点「添加账号」选登录方式，按提示扫码或登录
            3. 选好账号，点「启动光遇」；多开在「多开」里配置

            扫一次码之后就不用再扫了，之后每次双击 → 点启动即可。
            多个账号可以随时在左边切换。

            ### 说明
            - 单个 exe，免安装；不装证书、不改 hosts、不开代理、不注入游戏进程
            - 启动前会自动关闭发烧平台，用完可以自己再打开
            - 窗口大小随屏幕自适应，记住上次的位置和尺寸（换屏幕自动重算）
            - 本版重点：网易账号凭证长期有效不再频繁过期；凭证文件加密存储；
              多开堆叠四种方案可选（监控墙里也能一键重排）；排列等客户端
              站稳后再动（防闪退，闪退会弹窗提示）；关闭登录器再打开，
              运行中的游戏照常识别
            - 出问题时点界面里的「打开日志」，把 log.txt 发出来

            ### 文件
            - `skylogin.exe` —— 主程序
            - `Source code` —— 源码压缩包（GitHub 自动生成）



