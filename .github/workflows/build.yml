name: 构建

# 只在两种情况下构建：
#   1. 手动触发（Actions 页面点「Run workflow」，或者用 gh 命令）
#   2. 推版本标签（v1.2.0 这种）
#
# 普通 push 不会触发——避免每次改代码都跑一遍构建。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.2.0）。留空则自动生成 build-<构建序号>'
        required: false
        type: string
      release:
        description: '构建完成后创建 GitHub Release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  UPDATE_API: https://api-skylogin.mmlhl.party
  # secrets 只能在这里（workflow 级 env）映射进 env 上下文，步骤的 if 才能读到
  APP_KEY: ${{ secrets.APP_KEY }}

jobs:
  build:
    name: 构建 Windows 版
    runs-on: windows-latest

    steps:
      - name: 检出代码（含完整历史与标签，生成更新说明用）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 不开 cache：Actions 存储免费额度只有 0.5GB，Go+npm 缓存
          # 按 ref 隔离双份存储，几次 tag 构建就爆；慢一分钟换零占用
          cache: false

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          $manual = "${{ inputs.version }}"
          $tag = "${{ github.ref_name }}"

          if ($manual -ne "") {
            $v = $manual.TrimStart('v')
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $v = $tag.TrimStart('v')
          } else {
            $v = "build-${{ github.run_number }}"
          }

          $isRelease = "${{ inputs.release }}" -eq "true" -or "${{ github.ref_type }}" -eq "tag"
          "version=$v" >> $env:GITHUB_OUTPUT
          # GitHub 的 if 是字符串比较，统一输出小写
          "release=$($isRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v / 创建 Release: $isRelease"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 跑测试
        run: go test ./...

      - name: 计算更新说明
        id: notes
        shell: pwsh
        run: |
          # 更新说明只有一个来源：仓库根目录的 RELEASE_NOTES.md。
          # Release 正文和更新服务里的 changelog 都用它，保证两处永远一致；
          # 没有这个文件时才按提交记录拼（老行为）。
          if (Test-Path RELEASE_NOTES.md) {
            $notes = ((Get-Content RELEASE_NOTES.md -Encoding utf8) | Where-Object { $_.Trim() }) -join "`n"
          } else {
            $prev = (git tag --sort=-creatordate)[1]
            $lines = if ($prev) { git log --oneline "$prev..HEAD" | Where-Object { $_ -notmatch '^[0-9a-f]{7} (ci|docs)[:(（]' -and $_ -notmatch '诊断' } } else { @() }
            $notes = ($lines | ForEach-Object { $_ -replace '^[0-9a-f]{7} ', '- ' }) -join "`n"
          }
          "notes<<NOTE" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "NOTE" >> $env:GITHUB_OUTPUT
          Write-Host "更新说明:"; Write-Host $notes

      - name: 构建 exe
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $bt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mmZ")
          $ldflags = "-s -w -H=windowsgui -X skylogin/internal/app.Version=${{ steps.ver.outputs.version }} -X skylogin/internal/app.Build=${{ github.run_number }} -X skylogin/internal/app.BuildTime=$bt"
          go build -trimpath -ldflags $ldflags -o skylogin.exe ./cmd/skylogin
          $size = [math]::Round((Get-Item skylogin.exe).Length / 1MB, 1)
          Write-Host "构建完成: skylogin.exe ($size MB)"

      - name: 登记新版本到更新服务
        if: steps.ver.outputs.release == 'true' && env.APP_KEY != ''
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        shell: pwsh
        run: |
          $payload = @{
            version = "${{ steps.ver.outputs.version }}"
            build = ${{ github.run_number }}
            download_url = "https://github.com/mmlhl/skylogin/releases/latest"
            changelog = "${{ steps.notes.outputs.notes }}"
            force = $false
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Uri "${{ env.UPDATE_API }}/admin/version" -Method Post -ContentType "application/json; charset=utf-8" -Headers @{ "X-App-Key" = $env:APP_KEY } -Body $payload
            Write-Host "已登记版本"
          } catch { Write-Warning ("登记失败: " + $_.Exception.Message) }

      - name: 创建 Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          # 只放 exe；源码压缩包 GitHub 会自动附在 Release 上
          files: skylogin.exe
          draft: false
          prerelease: false
          # 结构：本次更新置顶，使用说明收在后面
          body: |
            ## 光遇账号登录器 v${{ steps.ver.outputs.version }}

            ### 本次更新
            ${{ steps.notes.outputs.notes }}

            ### 使用说明

            **支持哪些账号**

            | 渠道 | 弹出窗口（验证码 / 账号密码） | 游戏内扫码（加好友界面） |
            |---|:---:|:---:|
            | **网易官方** | 🟢 扫码 / 手机号 / 账密 | 🔵 |
            | **华为** | 🟢 华为账号扫码 | 🟡 约 1 小时 |
            | **vivo** | 🟢 验证码 / 账号密码 | 🟡 约 1 小时 |
            | **B站** | 🟢 验证码 / 账号密码 | 🔵 |
            | **4399** | 🟢 验证码 / 账号密码 | 🔵 |
            | **九游** | ⚪ | 🔵 |

            🟢 长期可用 · 🟡 临时（约 1 小时，过期后重新扫一次）· 🔵 未实测 · ⚪ 不支持

            选对应的渠道名进入即可，比如 vivo 账号就点「vivo账号」。

            **怎么用**
            1. 下载 `skylogin.exe`，双击运行（会请求管理员权限，光遇本体需要）
            2. 点「添加账号」选登录方式，按提示扫码或登录
            3. 选好账号，点「启动光遇」；多开在「多开」里配置

            扫一次码之后就不用再扫了，之后每次双击 → 点启动即可。多个账号可以随时在左边切换。

            **说明**
            - 单个 exe，免安装；不装证书、不改 hosts、不开代理、不注入游戏进程
            - 启动前会自动关闭发烧平台，用完可以自己再打开
            - 窗口大小随屏幕自适应，记住上次的位置和尺寸（换屏幕自动重算）
            - 网易账号凭证支持自动续期；凭证文件加密存储
            - 出问题时点界面里的「打开日志」，把 log.txt 发出来

            **下载**：本页 `skylogin.exe`，或 [123 网盘](https://1822397226.share.123pan.cn/123pan/87OJjv-vhMl?pwd=l5sX)

            **交流群**：QQ `1053415841`（使用问题、反馈都放这里）
